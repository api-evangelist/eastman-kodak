source: live HTTPS probes of every Eastman Kodak host this record knows
note: >-
  Probed the five named /.well-known/ paths on every Kodak-controlled host in the record —
  the registrable domain and www, the public product-documentation host, the Salesforce
  customer portal, the investor-relations host and the legacy www2 host. Exactly one path
  returned a real document: https://customer.kodak.com/.well-known/openid-configuration,
  the OpenID Connect discovery metadata for Kodak's customer support portal. That portal is
  a Salesforce Experience Cloud tenant served from a Kodak-controlled host (issuer
  "https://customer.kodak.com"), so the document is Kodak's to publish even though the
  authorization server software and the scope names are Salesforce platform scopes rather
  than Kodak product scopes. It authenticates humans into the support community; it is NOT
  an API authorization surface, and no Kodak API is reachable through it.
