version_range: 2.0.0 - 2.1.15
dates_note: >-
  Kodak does not print a release date on the pages. The dates below are the Confluence
  last-modified timestamps returned by the anonymous REST API for each page, which bound the
  release from above; they are labelled page_modified rather than released to avoid asserting
  a release date Kodak never stated.
