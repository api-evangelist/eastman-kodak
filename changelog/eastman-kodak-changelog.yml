note: >-
  Eastman Kodak publishes no API changelog because it publishes no public API. It DOES publish
  a public, anonymously readable, per-release changelog for the KODAK PRINERGY On Demand cloud
  platform on its Confluence documentation host: 28 "New Features, Bug Fixes and Limitations
  in <version>" pages covering 2.0.0 through 2.1.15, each listing new features and named bug
  fixes per component (Prinergy Portal, Prinergy Access, Cloud Agent, Kodak Cloud Content
  Processing, Digital Press Analytics, Cloud Service Tool). This is a PRODUCT changelog for a
  SaaS platform, not an API changelog — the entries reference internal component APIs
  (Imposition Processor API, ColorFlow measurement API, Device Profile Validation API) that
  Kodak does not publish a contract or reference for.
scheme: semver-ish two-level product version (major.minor.patch), cloud-deployed
